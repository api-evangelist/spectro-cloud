    v1ApiKeySpecUpdate_2:
      description: API key update request specification
      properties:
        expiry:
          description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
          format: date-time
          type: string
      type: object
    v1ApiKeyCreateResponse_2:
      description: Response of create API key
      example:
        uid: uid
        apiKey: apiKey
      properties:
        apiKey:
          description: Api key is used for authentication
          type: string
        uid:
          description: User uid
          type: string
      type: object
    v1ApiKeyStatus_2:
      description: API key status
      example:
        isActive: true
      properties:
        isActive:
          description: API key active state
          type: boolean
      type: object
    v1ApiKeys_2:
      example:
        items:
        - metadata:
            uid: uid
            creationTimestamp: 2000-01-23 04:56:07+00:00
            name: name
