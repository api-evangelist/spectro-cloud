openapi: 3.2.0
info:
  title: Spectro Cloud Overlords API
  version: v1
  description: 'Operations tagged overlords across 2 of this provider''s published API definitions: spectro-cloud-palette-openapi.json, spectrocloud-palette.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.spectrocloud.com
- url: /
tags:
- name: overlords
  x-displayName: Overlords
paths:
  /v1/overlords:
    get:
      operationId: v1OverlordsList
      parameters:
      - in: query
        name: name
        schema:
          type: string
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '200':
          description: (empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Overlords'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Retrieves a list of overlords owned by the tenant
      tags:
      - overlords
    servers:
    - url: https://api.spectrocloud.com
  /v1/overlords/apache-cloudstack/manifest:
    parameters:
