        additionalProperties:
          type: string
        description: Additional labels to be part of the machine pool
        type: object
      additionalTags:
        additionalProperties:
          type: string
        description: AdditionalTags is an optional set of tags to add to resources managed by the provider, in addition to the ones added by default. For eg., tags for EKS nodeGroup or EKS NodegroupIAMRole
        type: object
      isControlPlane:
        description: Whether this pool is for control plane
        type: boolean
        x-omitempty: false
      labels:
        description: 'Labels for this machine pool, example: control-plane/worker, gpu, windows'
        items:
          type: string
        type: array
      machinePoolProperties:
        $ref: '#/definitions/v1MachinePoolProperties'
      maxSize:
        description: Max size of the pool, for scaling
        format: int32
        type: integer
      minSize:
        description: Min size of the pool, for scaling
        format: int32
        type: integer
      name:
        type: string
      nodeRepaveInterval:
        description: Minimum number of seconds a node should be Ready, before the next node is selected for repave. Applicable only for workerpools in infrastructure cluster
        format: int32
        type: integer
      overrideClusterAPIConfig:
        description: 'YAML override for CAPI properties at pool level.

          Overrides pack-level and Palette-managed values. See PCP-4787.

          '
        type: string
      overrideHealthCheckConfiguration:
        description: 'YAML config to override Machine Health Check values at the node pool level.

          Accepts CAPI MachineHealthCheck fields such as maxUnhealthy, nodeStartupTimeout,

          and unhealthyNodeConditions. Falls back to Palette defaults when unset and

          remains subject to the project/tenant Cluster Auto Remediation setting.

          '
        type: string
      overrideKubeadmConfiguration:
        description: 'YAML config for kubeletExtraArgs, preKubeadmCommands, postKubeadmCommands.

          Overrides pack-level settings. Worker pools only.

          Currently implemented for CloudStack only.

          '
        type: string
      size:
        description: Size of the pool, number of nodes/machines
        format: int32
        type: integer
      skipK8sUpgrade:
        default: disabled
        description: 'Skip Kubernetes version upgrade validation for worker pools with N-3 version skew.

          - enabled: Bypasses version skew validation, allows Control Plane upgrade even when this worker pool is >3 minor versions behind

          - disabled: Automatically upgrade worker pool to match Control Plane Kubernetes version (default)

          '
        enum:
        - enabled
        - disabled
        type: string
        x-omitempty: true
      taints:
        description: control plane or worker taints
        items:
          $ref: '#/definitions/v1Taint'
        type: array
        uniqueItems: true
      updateStrategy:
        $ref: '#/definitions/v1UpdateStrategy'
        description: Rolling update strategy for this machine pool if not specified, will use ScaleOut
      useControlPlaneAsWorker:
        description: If IsControlPlane==true && useControlPlaneAsWorker==true, then will remove control plane taint this will not be used for worker pools
        type: boolean
        x-omitempty: false
    required:
    - name
    - size
    - labels
    type: object
