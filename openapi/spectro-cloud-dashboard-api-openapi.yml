components:
  schemas:
    v1SpcPolicySortFields:
      enum:
      - policyName
      - policyType
      - creationTimestamp
      - lastModifiedTimestamp
      type:
      - string
      - 'null'
    v1PackRef:
      description: PackRef server/name:tag to point to a pack PackRef is used when construct a ClusterProfile PackSpec is used for UI to render the parameters form ClusterProfile will not know inner details of a pack ClusterProfile only contain pack name:tag, and the param values user entered for it
      properties:
        annotations:
          additionalProperties:
            type: string
          description: Annotations is used to allow packref to add more arbitrary information one example is to add git reference for values.yaml
          type: object
        digest:
          description: digest is used to specify the version should be installed by palette when pack upgrade available, change this digest to trigger upgrade
          type: string
        inValidReason:
          type: string
        isInvalid:
          description: pack is invalid when the associated tag is deleted from the registry
          type: boolean
        layer:
          enum:
          - kernel
          - os
          - k8s
          - cni
          - csi
          - addon
          type: string
        logo:
          description: path to the pack logo
          type: string
        manifests:
          items:
            $ref: '#/components/schemas/v1ObjectReference'
          type: array
        name:
          description: pack name
          type: string
        packUid:
          description: PackUID is Hubble packUID, not palette Pack.UID It is used by Hubble only.
          type: string
        params:
          additionalProperties:
            type: string
          description: params passed as env variables to be consumed at installation time
          type: object
        presets:
          items:
            $ref: '#/components/schemas/v1PackPreset'
          type: array
        registryUid:
          description: pack registry uid
          type: string
        schema:
          items:
            $ref: '#/components/schemas/v1PackSchema'
          type: array
        server:
          description: pack registry server or helm repo
          type: string
        tag:
          description: pack tag
          type: string
        type:
          description: type of the pack
          enum:
          - spectro
          - helm
          - manifest
          - oci
          type: string
        values:
          description: values represents the values.yaml used as input parameters either Params OR Values should be used, not both If both applied at the same time, will only use Values
          type: string
        version:
          description: pack version
          type: string
      required:
      - layer
      - name
      type: object
    v1CloudCost:
      description: Cloud cost information
      properties:
        compute:
          format: float64
          type: number
          x-omitempty: false
        storage:
          format: float64
          type: number
          x-omitempty: false
        total:
          format: float64
          type: number
          x-omitempty: false
      type: object
    v1ClusterWorkloadPodContainerResources:
      description: Cluster workload pod container resources
      properties:
        limits:
          $ref: '#/components/schemas/v1ClusterWorkloadPodContainerResource'
        requests:
          $ref: '#/components/schemas/v1ClusterWorkloadPodContainerResource'
      type: object
    v1EdgeHostsMetadataStatus:
      properties:
        health:
          $ref: '#/components/schemas/v1EdgeHostHealth'
        inUseClusters:
          description: Deprecated. Use inUseClustersRef
          items:
            $ref: '#/components/schemas/v1ObjectEntity'
          type: array
        inUseClustersRef:
          items:
            $ref: '#/components/schemas/v1EdgeClusterObjectEntity'
          type: array
        state:
          $ref: '#/components/schemas/v1EdgeHostState'
      type: object
    v1PackRefSummary:
      description: Pack ref summary
      properties:
        addonType:
          type: string
        annotations:
          additionalProperties:
            type: string
          type: object
        displayName:
          type: string
        layer:
          $ref: '#/components/schemas/v1PackLayer'
        logoUrl:
          type: string
        name:
          type: string
        packUid:
          type: string
        tag:
          type: string
        type:
          type: string
        version:
          type: string
    v1ResourceCostDataPoint:
      description: Resource cost data point
      properties:
        cpu:
          format: float64
          type: number
          x-omitempty: false
        memory:
          format: float64
          type: number
          x-omitempty: false
        storage:
          format: float64
          type: number
          x-omitempty: false
        timestamp:
          format: int64
          type: number
        total:
          format: float64
          type: number
          x-omitempty: false
      type: object
    v1WorkspaceClustersWorkloadDaemonSets:
