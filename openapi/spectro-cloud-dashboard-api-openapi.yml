components:
  schemas:
    v1DashboardWorkspaces:
      properties:
        cpuUnit:
          type: string
        items:
          items:
            $ref: '#/components/schemas/v1DashboardWorkspace'
          type: array
          uniqueItems: true
        memoryUnit:
          type: string
      required:
      - items
      type: object
    v1SearchFilterKeyValueConditionMatch:
      properties:
        conjunction:
          $ref: '#/components/schemas/v1SearchFilterConjunctionOperator'
        values:
          items:
            type: string
          type: array
          uniqueItems: true
    v1ObjectResReference:
      description: Object resource reference
      properties:
        kind:
          type: string
        name:
          type: string
        projectUid:
          type: string
        tenantUid:
          type: string
        uid:
          type: string
      type: object
    v1ObjectReference:
      description: ObjectReference contains enough information to let you inspect or modify the referred object.
      properties:
        kind:
          description: 'Kind of the referent. More info: https://git.k8s.io/community/contributors/devel/api-conventions.md#types-kinds'
          type: string
        name:
          description: 'Name of the referent. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names'
          type: string
        uid:
          description: 'UID of the referent. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids'
          type: string
      type: object
    v1AppDeploymentSortSpec:
      properties:
        field:
          $ref: '#/components/schemas/v1AppDeploymentSortFields'
        order:
          $ref: '#/components/schemas/v1SortOrder'
    v1ResourceTotalCost:
      description: Resource total cost information
      properties:
        cpu:
          format: float64
          type: number
          x-omitempty: false
        memory:
          format: float64
          type: number
          x-omitempty: false
        storage:
          format: float64
          type: number
          x-omitempty: false
        total:
          format: float64
          type: number
          x-omitempty: false
      type: object
    v1WorkspaceClustersWorkloadDaemonSets:
      description: Workspace clusters workload statefulsets summary
      properties:
        clusters:
          items:
            $ref: '#/components/schemas/v1WorkspaceClusterWorkloadDaemonSets'
          type: array
        metadata:
          $ref: '#/components/schemas/v1ObjectMetaInputEntity'
      type: object
    v1ClusterProfileFilterSpec:
      description: Cluster profile filter spec
      properties:
        environment:
          items:
            type: string
          type: array
          uniqueItems: true
        fips:
          $ref: '#/components/schemas/v1ClusterFipsMode'
        profileName:
          $ref: '#/components/schemas/v1FilterString'
        profileType:
          items:
            $ref: '#/components/schemas/v1ProfileType'
          type: array
          uniqueItems: true
        resourceType:
          $ref: '#/components/schemas/v1ClusterProfileResourceType'
        scope:
          $ref: '#/components/schemas/v1ClusterProfileScope'
        tags:
          $ref: '#/components/schemas/v1FilterArray'
        version:
          $ref: '#/components/schemas/v1FilterVersionString'
    v1ClusterProfilePackSummary:
      description: Cluster profile packs summary about the deprecated, disabled, deleted packs count
      properties:
        deleted:
          description: Total count of deleted packs in a cluster profile
          type: number
          x-omitempty: false
        deprecated:
          description: Total count of deprecated packs in a cluster profile
          type: number
          x-omitempty: false
        disabled:
          description: Total count of disabled packs in a cluster profile
          type: number
          x-omitempty: false
      type: object
    v1PackSchema:
      description: PackSchema defines the schema definition, hints for the pack values
      properties:
        format:
          type: string
          x-omitempty: false
        hints:
          items:
            type: string
          type: array
          x-omitempty: false
        listOptions:
          items:
            type: string
          type: array
          x-omitempty: false
        name:
          type: string
          x-omitempty: false
        readonly:
          type: boolean
          x-omitempty: false
        regex:
          type: string
          x-omitempty: false
        required:
          type: boolean
          x-omitempty: false
        type:
          type: string
          x-omitempty: false
      type: object
    v1SpectroClustersMetadataSearch:
      properties:
        items:
          items:
            $ref: '#/components/schemas/v1SpectroClusterMetaSummary'
          type: array
          uniqueItems: true
        listmeta:
          $ref: '#/components/schemas/v1ListMetaData'
      required:
      - items
      type: object
    v1ClusterWorkloadStatefulSetStatus:
      description: Cluster workload statefulset status
      properties:
        replicas:
          $ref: '#/components/schemas/v1ClusterWorkloadReplicaStatus'
      type: object
    v1SpectroClusterHealthStatus:
      description: Spectro cluster health status
      properties:
        agentVersion:
          type: string
        conditions:
          items:
            $ref: '#/components/schemas/v1SpectroClusterHealthCondition'
          type: array
          uniqueItems: true
        lastHeartBeatTimestamp:
          $ref: '#/components/schemas/v1Time'
        state:
          type: string
    v1EdgeHostSpecHost:
      description: Host specifications
      properties:
        hostAddress:
          description: HostAddress is a FQDN or IP address of the Host
          type: string
        macAddress:
          type: string
    v1ClusterWorkloadPodMetadata:
      description: Cluster workload pod metadata
      properties:
        associatedRefs:
          items:
            $ref: '#/components/schemas/v1ClusterWorkloadRef'
          type: array
        creationTimestamp:
          $ref: '#/components/schemas/v1Time'
        entity:
          $ref: '#/components/schemas/v1ClusterWorkloadRef'
        labels:
          additionalProperties:
            type: string
          type: object
        machineUid:
          type: string
        namespace:
          type: string
        nodename:
          type: string
      type: object
    v1SearchFilterSchemaSpecEnumValue:
      properties:
        displayValue:
          type: string
        value:
          type: string
    v1SearchFilterDateOperator:
      enum:
      - eq
      - gt
      - gte
      - lt
      - lte
      - range
      type: string
    v1EdgeHostsSearchSummary:
      properties:
        items:
          items:
            $ref: '#/components/schemas/v1EdgeHostsMetadata'
          type: array
          uniqueItems: true
        listmeta:
          $ref: '#/components/schemas/v1ListMetaData'
      required:
      - items
      type: object
    v1ObjectEntity:
      description: Object identity meta
      properties:
        name:
          type: string
        uid:
          type: string
      type: object
    v1ClusterProfileTemplateMeta:
      description: Cluster profile template meta information
      properties:
        cloudType:
          type: string
        name:
          description: Cluster profile name
          type: string
        packs:
          description: Cluster profile packs array
          items:
            $ref: '#/components/schemas/v1PackRef'
          type: array
        scope:
          description: scope or context(system, tenant or project)
          type: string
        type:
          description: Cluster profile type [ "cluster", "infra", "add-on", "system" ]
          type: string
        uid:
          description: Cluster profile uid
          type: string
        version:
          format: int32
          type: integer
      type: object
    v1IpPoolStatus:
      description: IP Pool status
      properties:
        allottedIps:
          items:
            type: string
          type: array
          uniqueItems: true
        associatedClusters:
          items:
            type: string
          type: array
          uniqueItems: true
        availableIps:
          items:
            type: string
          type: array
          uniqueItems: true
        inUse:
          type: boolean
          x-omitempty: false
      type: object
    v1ClusterMetaStatusHealth:
      description: Cluster meta health information
      properties:
        isHeartBeatFailed:
          type: boolean
          x-omitempty: false
        state:
          type: string
      type: object
    v1ResourceUsageMeteringDataPoint:
      description: min and max count for machines & edgehost for the given period
      properties:
        activeEdgehosts:
          format: int64
          type: number
        activeMachines:
          format: int64
          type: number
        maxEdgehosts:
          format: int64
          type: number
        maxMachines:
          format: int64
          type: number
      type: object
    v1EdgeHostsMetadataSortSpec:
      properties:
        field:
          $ref: '#/components/schemas/v1EdgeHostsMetadataSortFields'
        order:
          $ref: '#/components/schemas/v1SortOrder'
    v1ResourceConsumptionSpec:
      description: Resource consumption spec
      properties:
        filter:
          $ref: '#/components/schemas/v1ResourceConsumptionFilter'
        options:
          $ref: '#/components/schemas/v1ResourceConsumptionOptions'
      type: object
    v1ClusterRbacBinding:
      description: Cluster RBAC binding
      properties:
        namespace:
          type: string
        role:
          $ref: '#/components/schemas/v1ClusterRoleRef'
        subjects:
          items:
            $ref: '#/components/schemas/v1ClusterRbacSubjects'
          type: array
          uniqueItems: true
        type:
          enum:
          - RoleBinding
          - ClusterRoleBinding
          type: string
      type: object
    v1ClusterWorkloadPodContainerResources:
      description: Cluster workload pod container resources
      properties:
        limits:
          $ref: '#/components/schemas/v1ClusterWorkloadPodContainerResource'
        requests:
          $ref: '#/components/schemas/v1ClusterWorkloadPodContainerResource'
      type: object
    v1ClusterWorkloadsFilter:
      description: Cluster workloads filter
      properties:
        namespaces:
          items:
            type: string
          type: array
          uniqueItems: true
      type: object
    v1ClusterNotificationStatus:
      description: Cluster notifications status
      properties:
        isAvailable:
          type: boolean
          x-omitempty: false
        isTemplateVariableResolutionPending:
          type: boolean
          x-omitempty: false
    v1SearchFilterStringConditionMatch:
      properties:
        conjunction:
          $ref: '#/components/schemas/v1SearchFilterConjunctionOperator'
        values:
          items:
            type: string
          type: array
          uniqueItems: true
    v1Disk:
