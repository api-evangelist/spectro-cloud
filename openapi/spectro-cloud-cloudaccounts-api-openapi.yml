      isDefault:
        description: Whether this is the default network
        type: boolean
      isShared:
        description: Whether the network is shared across accounts
        type: boolean
      name:
        description: Network name
        type: string
      netmask:
        description: Network mask for the network
        type: string
      networkDomain:
        description: Network domain
        type: string
      networkOffering:
        description: Network offering name
        type: string
      state:
        description: Current state of the network (Setup, Allocated, etc.)
        type: string
      trafficType:
        description: Traffic type of the network (Guest, Management, etc.)
        type: string
      type:
        description: Network type - Isolated, Shared, etc.
        type: string
      zoneId:
        description: Zone ID where the network is located
        type: string
      zoneName:
        description: Zone name where the network is located
        type: string
    type: object
