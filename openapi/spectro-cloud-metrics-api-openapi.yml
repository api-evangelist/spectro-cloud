openapi: 3.2.0
info:
  title: Spectro Cloud Metrics API
  version: v1
  description: 'Operations tagged metrics across 2 of this provider''s published API definitions: spectro-cloud-palette-openapi.json, spectrocloud-palette.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.spectrocloud.com
- url: /
tags:
- name: Metrics
  x-displayName: Metrics
paths:
  /v1/metrics/{resourceKind}/values:
    get:
      description: Returns all the metrics for a given resource kind
      operationId: v1MetricsList
      parameters:
      - in: path
        name: resourceKind
        required: true
        schema:
          type: string
          enum:
          - pod
          - namespace
          - spectrocluster
          - machine
          - project
      - in: query
        name: metricKind
        schema:
          type: string
          default: all
      - description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
        in: query
        name: startTime
        schema:
          type: string
          format: date-time
      - description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
        in: query
        name: endTime
        schema:
          type: string
          format: date-time
      - in: query
        name: period
        schema:
          type: integer
          format: int32
          default: 1
      - description: Deprecated. includeMasterMachines in boolean, group the data point by including control plane nodes if set to true
        in: query
        name: includeMasterMachines
        schema:
          type: boolean
          default: false
      - description: includeControlPlaneMachines in boolean, group the data point by including control plane nodes if set to true
        in: query
        name: includeControlPlaneMachines
        schema:
          type: boolean
          default: false
      - description: if true then api returns only aggregation values, else api returns all data points by default
        in: query
        name: discrete
        schema:
          type: boolean
          default: false
      - in: query
        name: spectroClusterUid
        schema:
          type: string
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '200':
          description: An array of metric items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1MetricTimeSeriesList'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Retrieves the list of metrics for a specified resource kind
      tags:
      - Metrics
    servers:
    - url: https://api.spectrocloud.com
  /v1/metrics/{resourceKind}/{resourceUid}/values:
    delete:
      operationId: v1MetricsUidDelete
      parameters:
      - in: path
        name: resourceKind
        required: true
        schema:
          type: string
          enum:
          - pod
          - namespace
          - spectrocluster
          - machine
          - project
      - in: path
        name: resourceUid
        required: true
        schema:
          type: string
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '204':
          description: The resource was deleted successfully
      security:
      - ApiKey: []
      - Authorization: []
      summary: Deletes the metrics of the specified resource
      tags:
      - Metrics
    get:
      operationId: v1MetricsUidList
      parameters:
      - in: path
        name: resourceKind
        required: true
        schema:
          type: string
          enum:
          - pod
          - namespace
          - spectrocluster
          - machine
          - project
      - in: path
        name: resourceUid
        required: true
        schema:
          type: string
      - description: multiple metric kinds can be provided with comma separated
        in: query
        name: metricKind
        schema:
          type: string
          default: all
      - description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
        in: query
        name: startTime
        schema:
          type: string
          format: date-time
      - description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
        in: query
        name: endTime
        schema:
          type: string
          format: date-time
      - description: period in minutes, group the data point by the specified period
        in: query
        name: period
        schema:
          type: integer
          format: int32
          default: 1
      - description: Deprecated. includeMasterMachines in boolean, group the data point by including control plane nodes if set to true
        in: query
        name: includeMasterMachines
        schema:
          type: boolean
          default: false
      - description: includeControlPlaneMachines in boolean, group the data point by including control plane nodes if set to true
        in: query
        name: includeControlPlaneMachines
        schema:
          type: boolean
          default: false
      - description: if true then api returns only aggregation values, else api returns all data points by default
        in: query
        name: discrete
        schema:
          type: boolean
          default: false
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '200':
          description: An array of metric items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1MetricTimeSeries'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Returns the metrics for a specified resource uid
      tags:
      - Metrics
    servers:
    - url: https://api.spectrocloud.com
