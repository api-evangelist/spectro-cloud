openapi: 3.2.0
info:
  title: Spectro Cloud Filters API
  version: v1
  description: 'Operations tagged filters across 2 of this provider''s published API definitions: spectro-cloud-palette-openapi.json, spectrocloud-palette.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.spectrocloud.com
- url: /
tags:
- name: Filters
  x-displayName: Filters
paths:
  /v1/filters:
    get:
      operationId: v1FiltersList
      parameters:
      - description: 'limit is a maximum number of responses to return for a list call. Default and maximum value of the limit is 50.

          If more items exist, the server will set the `continue` field on the list metadata to a value that can be used with the same initial query to retrieve the next set of results.'
        in: query
        name: limit
        schema:
          type: integer
          format: int64
          default: 50
      - description: offset is the next index number from which the response will start. The response offset value can be used along with continue token for the pagination.
        in: query
        name: offset
        schema:
          type: integer
          format: int64
      - description: continue token to paginate the subsequent data items
        in: query
        name: continue
        schema:
          type: string
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '200':
          description: An array of filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1FiltersSummary'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Returns a list of Filters
      tags:
      - Filters
    servers:
    - url: https://api.spectrocloud.com
  /v1/filters/metadata:
    get:
      operationId: v1FiltersMetadata
      parameters:
      - description: filterType can be - [tag, meta, resource]
        in: query
        name: filterType
        schema:
          type: string
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '200':
          description: An array of filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1FiltersMetadata'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Returns a list of Filters metadata
      tags:
      - Filters
    servers:
    - url: https://api.spectrocloud.com
  /v1/filters/tag:
    post:
      operationId: v1TagFiltersCreate
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '201':
          description: Created successfully
          headers:
