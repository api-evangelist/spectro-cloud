swagger: '2.0'
info:
  title: Local Management APIs activations ping API
  version: v1
servers:
- url: https://edge-host-ip:5080
schemes:
- http
- https
consumes:
- application/json
produces:
- application/json
tags:
- name: ping
  x-displayName: Ping
paths:
  /v1/ping:
    get:
      description: Ping Service
      tags:
      - ping
      summary: Ping Service
      operationId: V1Ping
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/v1Ping'
        default:
          description: generic error response
          schema:
            $ref: '#/definitions/apiError'
      security:
      - Authorization: []
definitions:
  apiError:
    type: string
  v1Ping:
    type: object
    properties:
      msg:
        type: string
securityDefinitions:
  Authorization:
    description: JWT authorization token obtained using /v1/users/default/login API
    type: apiKey
    name: Authorization
    in: header
