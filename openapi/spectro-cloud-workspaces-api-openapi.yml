openapi: 3.2.0
info:
  title: Spectro Cloud Workspaces API
  version: v1
  description: 'Operations tagged workspaces across 2 of this provider''s published API definitions: spectro-cloud-palette-openapi.json, spectrocloud-palette.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.spectrocloud.com
- url: /
tags:
- name: Workspaces
  x-displayName: Workspaces
paths:
  /v1/workspaces:
    post:
      operationId: v1WorkspacesCreate
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '201':
          description: Created successfully
          headers:
            AuditUid:
              description: Audit uid for the request
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Uid'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Create workspace
      tags:
      - Workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1WorkspaceEntity'
    servers:
    - url: https://api.spectrocloud.com
  /v1/workspaces/teams/{teamUid}/roles:
    parameters:
    - in: path
      name: teamUid
      required: true
      schema:
        type: string
    get:
      operationId: v1TeamsWorkspaceGetRoles
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1WorkspaceScopeRoles'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Returns the specified team's workspaces and roles data
      tags:
      - Workspaces
    put:
      operationId: v1TeamsWorkspaceRolesPut
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '204':
          description: The resource was updated successfully
      security:
      - ApiKey: []
      - Authorization: []
      summary: Updates the workspace roles for the specified team
      tags:
      - Workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1WorkspacesRolesPatch'
        required: true
    servers:
    - url: https://api.spectrocloud.com
  /v1/workspaces/users/{userUid}/roles:
    parameters:
    - in: path
      name: userUid
      required: true
      schema:
        type: string
    get:
      description: Returns a User with workspaces and roles
      operationId: v1UsersWorkspaceGetRoles
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1WorkspaceScopeRoles'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Returns the specified User workspaces and Roles information
      tags:
      - Workspaces
    put:
      description: User is updated with workspace roles
      operationId: v1UsersWorkspaceRolesPut
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '204':
          description: The resource was updated successfully
      security:
      - ApiKey: []
      - Authorization: []
      summary: Updates the workspace roles for user
      tags:
      - Workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1WorkspacesRolesPatch'
        required: true
    servers:
    - url: https://api.spectrocloud.com
  /v1/workspaces/validate/name:
    get:
      operationId: v1WorkspacesValidateName
      parameters:
      - in: query
        name: name
        required: true
        schema:
          type: string
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '204':
          description: Ok response without content
          headers:
            AuditUid:
              description: Audit uid for the request
              schema:
                type: string
      security:
      - ApiKey: []
      - Authorization: []
      summary: Validates the workspace name
      tags:
      - Workspaces
    servers:
    - url: https://api.spectrocloud.com
  /v1/workspaces/{uid}:
    parameters:
    - in: path
      name: uid
      required: true
      schema:
        type: string
    delete:
      operationId: v1WorkspacesUidDelete
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '204':
          description: The resource was deleted successfully
      security:
      - ApiKey: []
      - Authorization: []
      summary: Deletes the specified workspace
      tags:
      - Workspaces
    get:
      operationId: v1WorkspacesUidGet
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Workspace'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Returns the specified workspace
      tags:
      - Workspaces
    servers:
    - url: https://api.spectrocloud.com
  /v1/workspaces/{uid}/backup:
    parameters:
