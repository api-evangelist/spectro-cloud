openapi: 3.2.0
info:
  title: Palette APIs - 4.9 Health API
  version: v1
servers:
- url: https://api.spectrocloud.com
tags:
- name: Health
  x-displayName: Health
paths:
  /v1/health/ping:
    get:
      operationId: V1HealthPing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1HealthPing'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Ping Service
      tags:
      - Health
  /v1/health/ready:
    get:
      operationId: V1HealthReady
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1HealthPing'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Ready Service
      tags:
      - Health
components:
  schemas:
    v1HealthPing:
      properties:
        msg:
          type: string
      type: object
  securitySchemes:
    ApiKey:
      description: API key authorization where API key can be generated from Palette console under Profile > My API Keys
      in: header
      name: ApiKey
      type: apiKey
    Authorization:
      description: JWT token authorization obtained using /v1/auth/authenticate api
      in: header
      name: Authorization
      type: apiKey
