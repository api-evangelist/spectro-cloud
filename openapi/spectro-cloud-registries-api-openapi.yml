definitions:
  v1OciImageRegistry:
    description: Oci Image Registry
    properties:
      baseContentPath:
        description: baseContentPath is the root path for the registry content
        type: string
      caCert:
        type: string
      endpoint:
        type: string
      insecureSkipVerify:
        type: boolean
      mirrorRegistries:
        description: mirrorRegistries contains the array of image sources like gcr.io, ghcr.io, docker.io
        type: string
      name:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  v1OciRegistryEntity:
    description: Oci registry credentials
    properties:
      auth:
        $ref: '#/definitions/v1RegistryAuth'
      defaultRegion:
        type: string
      endpoint:
        type: string
      providerType:
        type: string
      scope:
        type: string
      type:
        type: string
    type: object
  v1AwsCloudAccountCredentialType:
    default: secret
    description: Allowed Values [secret, sts, pod-identity]. STS type will be used for role assumption for sts type, accessKey/secretKey contains the source account, Arn is the target account. Pod Identity type will be used for EKS Pod Identity authentication with roleArn as the target account.
    enum:
    - secret
    - sts
    - pod-identity
    type: string
  v1RegistryMetadata:
    description: Registry meta
    properties:
      isDefault:
        type: boolean
        x-omitempty: false
      isPrivate:
        type: boolean
        x-omitempty: false
      kind:
        type: string
      name:
        type: string
      scope:
        type: string
      uid:
        type: string
    type: object
  v1AwsCloudAccount:
    description: AWS cloud account which includes access key and secret key in case of 'secret' credentials type. It includes policyARNS, ARN and externalId in case of sts. It includes roleArn and permissionBoundaryArn in case of podIdentity. Partition is a group of AWS Region and Service objects
    properties:
      accessKey:
        description: AWS account access key
        type: string
      credentialType:
        $ref: '#/definitions/v1AwsCloudAccountCredentialType'
      partition:
        default: aws
        description: AWS accounts are scoped to a single partition. Allowed values [aws, aws-us-gov], Default values
        enum:
        - aws
        - aws-us-gov
        - aws-iso
        - aws-iso-b
        type: string
      podIdentity:
        $ref: '#/definitions/v1AwsPodIdentityCredentials'
        description: AWS EKS Pod Identity credentials in case of credentialType podIdentity, will be empty in case of other credential types
      policyARNs:
        description: List of policy ARNs required in case of credentialType sts.
        items:
          type: string
        type: array
      secretKey:
        description: AWS account secret key
        type: string
      secretSpec:
        $ref: '#/definitions/v1AwsSecretSpec'
      secretToken:
        description: AWS account secret token; in case of aws-iso and aws-iso-b
        type: string
      sts:
        $ref: '#/definitions/v1AwsStsCredentials'
        description: AWS STS credentials in case of credentialType sts, will be empty in case of credential type secret
    type: object
  v1OciRegistrySpec:
    description: Image registry spec
    properties:
      containsSpectroManifest:
        type: boolean
        x-omitempty: false
      defaultRegion:
        type: string
      endpoint:
        type: string
      isPrivate:
        type: boolean
      providerType:
        type: string
      registryType:
        type: string
      scope:
        type: string
    type: object
  v1HelmRegistrySpecEntity:
    description: Helm registry credentials spec
    properties:
      auth:
        $ref: '#/definitions/v1RegistryAuth'
      createOption:
        $ref: '#/definitions/v1HelmRegistryCreateOption'
      endpoint:
        type: string
      isPrivate:
        type: boolean
      name:
        type: string
      scope:
        type: string
    required:
    - endpoint
    - auth
    type: object
  v1HelmRegistrySummary:
    description: Helm Registry summary
    properties:
      metadata:
        $ref: '#/definitions/v1ObjectMeta'
      spec:
        $ref: '#/definitions/v1HelmRegistrySpecSummary'
      status:
        $ref: '#/definitions/v1HelmRegistryStatusSummary'
    type: object
  v1TlsConfiguration:
    description: TLS configuration
    properties:
      ca:
        type: string
      certificate:
        type: string
      enabled:
        type: boolean
        x-omitempty: false
      insecureSkipVerify:
        type: boolean
        x-omitempty: false
      key:
        type: string
    type: object
  v1AwsSecretTlsConfig:
    description: TLS configuration for the AWS secret
    properties:
      ca:
        description: CA certificate
        type: string
      cert:
        description: Certificate
        type: string
      key:
        description: Key
        type: string
    type: object
  v1PackRegistrySummary:
    description: Pack Registry summary
    properties:
      metadata:
        $ref: '#/definitions/v1ObjectMeta'
      spec:
        $ref: '#/definitions/v1PackRegistrySpecSummary'
      status:
        $ref: '#/definitions/v1PackRegistryStatusSummary'
    type: object
  v1HelmRegistryEntity:
    description: Helm registry information
    properties:
      metadata:
        $ref: '#/definitions/v1ObjectMeta'
      spec:
        $ref: '#/definitions/v1HelmRegistrySpecEntity'
    type: object
  v1ObjectMeta:
    description: ObjectMeta is metadata that all persisted resources must have, which includes all objects users must create.
    properties:
      annotations:
        additionalProperties:
          type: string
        description: 'Annotations is an unstructured key value map stored with a resource that may be set by external tools to store and retrieve arbitrary metadata. They are not queryable and should be preserved when modifying objects. More info: http://kubernetes.io/docs/user-guide/annotations'
        type: object
      creationTimestamp:
        $ref: '#/definitions/v1Time'
        description: 'CreationTimestamp is a timestamp representing the server time when this object was created. It is not guaranteed to be set in happens-before order across separate operations. Clients may not set this value. It is represented in RFC3339 form and is in UTC.


          Populated by the system. Read-only. Null for lists. More info: https://git.k8s.io/community/contributors/devel/api-conventions.md#metadata'
      deletionTimestamp:
        $ref: '#/definitions/v1Time'
        description: 'DeletionTimestamp is RFC 3339 date and time at which this resource will be deleted. This field is set by the server when a graceful deletion is requested by the user, and is not directly settable by a client. The resource is expected to be deleted (no longer visible from resource lists, and not reachable by name) after the time in this field, once the finalizers list is empty. As long as the finalizers list contains items, deletion is blocked. Once the deletionTimestamp is set, this value may not be unset or be set further into the future, although it may be shortened or the resource may be deleted prior to this time. For example, a user may request that a pod is deleted in 30 seconds. The Kubelet will react by sending a graceful termination signal to the containers in the pod. After that 30 seconds, the Kubelet will send a hard termination signal (SIGKILL) to the container and after cleanup, remove the pod from the API. In the presence of network partitions, this object may still exist after this timestamp, until an administrator or automated process can determine the resource is fully terminated. If not set, graceful deletion of the object has not been requested.


          Populated by the system when a graceful deletion is requested. Read-only. More info: https://git.k8s.io/community/contributors/devel/api-conventions.md#metadata'
      labels:
        additionalProperties:
          type: string
        description: 'Map of string keys and values that can be used to organize and categorize (scope and select) objects. May match selectors of replication controllers and services. More info: http://kubernetes.io/docs/user-guide/labels'
        type: object
      lastModifiedTimestamp:
        $ref: '#/definitions/v1Time'
        description: 'LastModifiedTimestamp is a timestamp representing the server time when this object was last modified. It is not guaranteed to be set in happens-before order across separate operations. Clients may not set this value. It is represented in RFC3339 form and is in UTC.


          Populated by the system. Read-only. Null for lists. More info: https://git.k8s.io/community/contributors/devel/api-conventions.md#metadata'
      name:
        description: 'Name must be unique within a namespace. Is required when creating resources, although some resources may allow a client to request the generation of an appropriate name automatically. Name is primarily intended for creation idempotence and configuration definition. Cannot be updated. More info: http://kubernetes.io/docs/user-guide/identifiers#names'
        type: string
      uid:
        description: 'UID is the unique in time and space value for this object. It is typically generated by the server on successful creation of a resource and is not allowed to change on PUT operations.


          Populated by the system. Read-only. More info: http://kubernetes.io/docs/user-guide/identifiers#uids'
        type: string
    type: object
  v1RegistryConfiguration:
    description: Registry configuration
    properties:
      auth:
        $ref: '#/definitions/v1RegistryAuth'
      endpoint:
        type: string
      name:
        type: string
    type: object
  v1PackRegistrySpec:
    description: Pack registry credentials spec
    properties:
      auth:
        $ref: '#/definitions/v1RegistryAuth'
      endpoint:
        type: string
      name:
        type: string
      private:
        type: boolean
        x-omitempty: false
      registryUid:
        description: Pack registry uid
        type: string
      scope:
        type: string
    required:
    - endpoint
    - auth
    type: object
  v1Time:
    description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
    format: date-time
    type: string
  v1HelmRegistrySpec:
    description: Helm registry credentials spec
    properties:
      auth:
        $ref: '#/definitions/v1RegistryAuth'
      endpoint:
        type: string
      isPrivate:
        type: boolean
        x-omitempty: false
      name:
        type: string
      registryUid:
        description: Helm registry uid
        type: string
      scope:
        type: string
    required:
    - endpoint
    - auth
    type: object
  v1RegistryAuth:
    description: Auth credentials of the registry
    properties:
      password:
        format: password
        type: string
      tls:
        $ref: '#/definitions/v1TlsConfiguration'
      token:
        format: password
        type: string
      type:
        enum:
        - noAuth
        - basic
        - token
        type: string
      username:
        type: string
    type: object
  v1RegistryConfigEntity:
    description: Registry configuration entity
    properties:
      config:
        $ref: '#/definitions/v1RegistryConfiguration'
    type: object
  v1PackRegistries:
    properties:
      items:
        items:
          $ref: '#/definitions/v1PackRegistry'
        type: array
        uniqueItems: true
      listmeta:
        $ref: '#/definitions/v1ListMetaData'
    required:
    - items
    type: object
  v1HelmRegistry:
