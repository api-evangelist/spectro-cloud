    properties:
      baseContentPath:
        description: OCI ecr registry content base path
        type: string
      containsSpectroManifest:
        type: boolean
        x-omitempty: false
      credentials:
        $ref: '#/definitions/v1AwsCloudAccount'
      defaultRegion:
        type: string
      endpoint:
        type: string
      isPrivate:
        type: boolean
      isSyncSupported:
        type: boolean
      providerType:
        default: helm
        enum:
        - helm
        - pack
        - zarf
        type: string
      registryUid:
        description: Ecr registry uid
        type: string
      scope:
        type: string
      tls:
        $ref: '#/definitions/v1TlsConfiguration'
