openapi: 3.2.0
info:
  title: Spectro Cloud Registries API
  version: v1
  description: 'Operations tagged registries across 2 of this provider''s published API definitions: spectro-cloud-palette-openapi.json, spectrocloud-palette.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.spectrocloud.com
- url: /
tags:
- name: Registries
  x-displayName: Registries
paths:
