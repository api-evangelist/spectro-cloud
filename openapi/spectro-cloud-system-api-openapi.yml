              description: Audit uid for the request
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Uid'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Error'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Validates activation key, updates plan, logs activation, updates cache
      tags:
      - System
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1SystemActivateRequest'
        required: true
