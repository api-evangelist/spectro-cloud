components:
  schemas:
    v1ThemeStatus:
      properties:
        active:
          description: Specifies if the theme is active or not
          type: boolean
          x-omitempty: false
    v1Alerts:
      items:
        $ref: '#/components/schemas/v1Alert'
      type: array
    v1SystemAdminProfile:
      description: System Administrator Profile Entity
      properties:
        metadata:
          $ref: '#/components/schemas/v1ObjectMetaInputEntity'
        spec:
          $ref: '#/components/schemas/v1SystemAdminProfileSpec'
      type: object
    v1Updated:
      description: The resource was updated successfully
    v1SystemVsphereImageSpec:
      description: system vsphere account specifications
      properties:
        caCert:
          type: string
        imagesHostEndpoint:
          type: string
        insecureSkipVerify:
          type: boolean
        overlordOvaLocation:
          type: string
    v1AuthTokenSettings:
      description: System auth token settings
      properties:
        expiryTimeMinutes:
          description: Auth token expiry time in minutes
          format: int32
          maximum: 1440
          minimum: 15
          type: integer
          x-omitempty: false
    v1SystemCloudstackImageSpec:
      description: system cloudstack account specifications
      properties:
        imagesHostEndpoint:
          type: string
    v1SystemEdgeImageSpec:
      description: system edge account specifications
      properties:
        caCert:
          type: string
        imagesHostEndpoint:
          type: string
        insecureSkipVerify:
          type: boolean
    v1V1SystemAdminPasswordResetEntity:
      description: SystemAdmin
      properties:
        email:
          type: string
        newPassword:
          type: string
        oldPassword:
          type: string
      type: object
    v1SystemProxySpec:
      description: system proxy config spec
      properties:
        httpProxy:
          type: string
        httpsProxy:
          type: string
        noProxy:
          type: string
      type: object
    v1SystemTimeseriesMetrics:
      description: system timeseries metrics config
      properties:
        archivalInterval:
          type: integer
        batchInterval:
          type: integer
        enabled:
          type: boolean
          x-omitempty: false
        retentionPeriod:
          type: integer
      type: object
    v1DomainHost:
      description: update domain host for application. RootDomain gets dervied from domain host url
      properties:
        host:
          type: string
      type: object
    v1SystemPlanCredit:
      description: Plan Credit
      properties:
        cpuCoreHours:
          format: int64
          type: number
          x-omitempty: false
        creditUid:
          type: string
        expiry:
          $ref: '#/components/schemas/v1Time'
          description: credit expiry time
        name:
          type: string
        start:
          $ref: '#/components/schemas/v1Time'
          description: credit start time
        type:
          enum:
          - Pure
          - Alloy
          type: string
      required:
      - type
    v1SystemAzureStorage:
      description: SystemAdmin
      properties:
        spec:
          $ref: '#/components/schemas/v1SystemAzureStorageSpec'
      type: object
    v1PasswordsBlockListEntity:
      description: List of block listed passwords
      properties:
        passwords:
          items:
            type: string
          type: array
      type: object
    v1SystemAwsImage:
      description: SystemAdmin
      properties:
        spec:
          $ref: '#/components/schemas/v1SystemAwsImageSpec'
      type: object
    v1DatabaseTransferStatus:
      description: database transfer status
      properties:
        backups:
