          application/json:
            schema:
              $ref: '#/components/schemas/v1EdgeTokenEntity'
    servers:
    - url: https://api.spectrocloud.com
  /v1/edgehosts/tokens/{uid}:
    parameters:
    - description: Edge token uid
      in: path
      name: uid
      required: true
      schema:
        type: string
    delete:
      operationId: v1EdgeTokensUidDelete
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '204':
          description: The resource was deleted successfully
      security:
      - ApiKey: []
      - Authorization: []
      summary: Deletes the specified edge token
      tags:
      - edgehosts
    get:
      operationId: v1EdgeTokensUidGet
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1EdgeToken'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Returns the specified edge token
      tags:
      - edgehosts
    put:
      operationId: v1EdgeTokensUidUpdate
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '204':
          description: The resource was updated successfully
      security:
      - ApiKey: []
      - Authorization: []
      summary: Updates the specified edge token
      tags:
      - edgehosts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1EdgeTokenUpdate'
    servers:
    - url: https://api.spectrocloud.com
  /v1/edgehosts/tokens/{uid}/state:
    parameters:
    - description: Edge token uid
      in: path
      name: uid
      required: true
      schema:
        type: string
    put:
      operationId: v1EdgeTokensUidState
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '204':
          description: The resource was updated successfully
      security:
