components:
  schemas:
    v1ObjectReference:
      description: ObjectReference contains enough information to let you inspect or modify the referred object.
      properties:
        kind:
          description: 'Kind of the referent. More info: https://git.k8s.io/community/contributors/devel/api-conventions.md#types-kinds'
          type: string
        name:
          description: 'Name of the referent. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names'
          type: string
        uid:
          description: 'UID of the referent. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids'
          type: string
      type: object
    v1ListMetaData:
      description: ListMeta describes metadata for the resource listing
      properties:
        continue:
          description: Next token for the pagination. Next token is equal to empty string indicates end of result set.
          type: string
          x-omitempty: false
        count:
          description: Total count of the resources which might change during pagination based on the resources addition or deletion
          type: integer
          x-omitempty: false
        limit:
          description: Number of records feteched
          type: integer
          x-omitempty: false
        offset:
          description: The next offset for the pagination. Starting index for which next request will be placed.
          type: integer
          x-omitempty: false
      type: object
    v1EdgeHostHealth:
      description: EdgeHostHealth defines the desired health state of EdgeHostDevice
      properties:
        agentVersion:
          type: string
        message:
          type: string
        state:
          enum:
          - healthy
          - unhealthy
          type: string
    v1SpectroClusterProfile:
      description: Cluster profile response
      properties:
        metadata:
          $ref: '#/components/schemas/v1ObjectMeta'
        spec:
          $ref: '#/components/schemas/v1SpectroClusterProfileSpec'
      type: object
    v1EdgeTokens:
      properties:
        items:
          description: List of edge tokens
          items:
            $ref: '#/components/schemas/v1EdgeToken'
          type: array
          uniqueItems: true
      required:
      - items
