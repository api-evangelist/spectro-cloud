openapi: 3.2.0
info:
  title: Spectro Cloud Edgehosts API
  version: v1
  description: 'Operations tagged edgehosts across 2 of this provider''s published API definitions: spectro-cloud-palette-openapi.json, spectrocloud-palette.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.spectrocloud.com
- url: /
tags:
- name: edgehosts
  x-displayName: Edgehosts
paths:
  /v1/edgehosts:
    get:
      description: Deprecated. Use POST /v1/dashboard/edgehosts/search , to retrieve all the edgehosts without pagination use GET /v1/edgehosts/metadata.
      operationId: v1EdgeHostDevicesList
      parameters:
      - in: query
        name: type
        schema:
          type: string
          enum:
          - edge-native
          - vsphere
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '200':
          description: An array of edge host device items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1EdgeHostDevices'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Retrieve the Complete Edgehost Metadata List
      tags:
      - edgehosts
    post:
      operationId: v1EdgeHostDevicesCreate
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '201':
          description: Created successfully
          headers:
            AuditUid:
              description: Audit uid for the request
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Uid'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Create the edge host device
      tags:
      - edgehosts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1EdgeHostDeviceEntity'
    servers:
    - url: https://api.spectrocloud.com
  /v1/edgehosts/metadata:
    get:
      operationId: v1EdgeHostsMetadataQuickFilterGet
      parameters:
      - in: query
        name: type
        schema:
          type: string
          enum:
          - edge-native
          - vsphere
      - in: query
        name: quickFilter
        schema:
          type: string
          enum:
          - unusedEdgeHosts
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '200':
          description: An array of edge host metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1EdgeHostsMeta'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Retrieves a list of edge hosts metadata matching the filter condition
      tags:
      - edgehosts
    servers:
    - url: https://api.spectrocloud.com
  /v1/edgehosts/register:
    post:
      operationId: v1EdgeHostDevicesRegister
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
