openapi: 3.2.0
info:
  title: Spectro Cloud Permissions API
  version: v1
  description: 'Operations tagged permissions across 2 of this provider''s published API definitions: spectro-cloud-palette-openapi.json, spectrocloud-palette.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.spectrocloud.com
- url: /
tags:
- name: Permissions
  x-displayName: Permissions
paths:
  /v1/permissions:
    get:
      operationId: v1PermissionsList
      parameters:
      - in: query
        name: scope
        schema:
          type: string
          enum:
          - system
          - tenant
          - project
          - resource
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '200':
          description: An array of permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Permissions'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Retrieves a list of permissions
      tags:
      - Permissions
    servers:
    - url: https://api.spectrocloud.com
components:
  schemas:
    v1Permission:
      description: Permission information
      properties:
        name:
          type: string
        permissions:
          items:
            type: string
          type: array
        scope:
          $ref: '#/components/schemas/v1Scope'
      type: object
    v1Scope:
      enum:
      - system
      - tenant
      - project
      - resource
      type: string
    v1Permissions:
      description: Array of permissions
      items:
        $ref: '#/components/schemas/v1Permission'
      type: array
    v1Permission_2:
      description: Permission information
      example:
        permissions:
        - permissions
        - permissions
        scope: system
        name: name
      properties:
        name:
          type: string
        permissions:
          items:
            type: string
          type: array
        scope:
          $ref: '#/components/schemas/v1Scope'
      type: object
  securitySchemes:
    ApiKey:
      description: API key authorization where API key can be generated from Palette console under Profile > My API Keys
      in: header
      name: ApiKey
      type: apiKey
    Authorization:
      description: JWT token authorization obtained using /v1/auth/authenticate api
      in: header
      name: Authorization
      type: apiKey
x-refined-from:
- spectro-cloud-palette-openapi.json
- spectrocloud-palette.yaml
