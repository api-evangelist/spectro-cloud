        type: string
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/v1ClusterProfilePacksManifests'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Returns the specified cluster profile pack manifests
      tags:
      - clusterprofiles
  /v1/clusterprofiles/{uid}/packs/resolvedValues:
    parameters:
    - description: Cluster profile uid
      in: path
      name: uid
      required: true
      type: string
    - in: body
