          description: UID of the Project that scopes this resource
          type: string
        uid:
          description: UID of the referenced resource
          type: string
      type: object
    v1PackSchema:
      description: PackSchema defines the schema definition, hints for the pack values
      properties:
        format:
          type: string
          x-omitempty: false
        hints:
          items:
            type: string
          type: array
          x-omitempty: false
        listOptions:
          items:
            type: string
          type: array
          x-omitempty: false
        name:
          type: string
          x-omitempty: false
        readonly:
          type: boolean
          x-omitempty: false
        regex:
          type: string
          x-omitempty: false
        required:
          type: boolean
          x-omitempty: false
        type:
          type: string
          x-omitempty: false
      type: object
    v1ManifestSpec:
      description: Manifest spec
      properties:
        draft:
          $ref: '#/components/schemas/v1ManifestData'
        published:
          $ref: '#/components/schemas/v1ManifestData'
      type: object
    v1VariableFormat:
      default: string
      description: Format type of the variable value
      enum:
      - string
      - number
      - boolean
      - ipv4
      - ipv4cidr
      - ipv6
      - version
      - base64
      type: string
    v1PackManifestImportEntity:
      description: Pack manifest import objct
      properties:
        content:
          description: Pack manifest content in yaml
          type: string
        name:
          description: Pack manifest name
          type: string
      type: object
    v1PackUpdateEntity:
      description: Pack update request payload
      properties:
        pack:
          $ref: '#/components/schemas/v1PackEntity'
    v1BulkDeleteResponse:
      properties:
        deletedCount:
          type: integer
          x-omitempty: false
        failures:
          items:
            $ref: '#/components/schemas/v1BulkDeleteFailure'
          type: array
          uniqueItems: true
          x-omitempty: false
        isSucceeded:
          type: boolean
          x-omitempty: false
        message:
          type: string
          x-omitempty: false
    v1ConstraintValidatorResponse:
      description: Constraint validator response
      properties:
        results:
          items:
            $ref: '#/components/schemas/v1ConstraintValidatorResult'
          type: array
          uniqueItems: true
      type: object
    v1PackSummaryStatus:
      description: Pack status
      type: object
    v1ClusterProfileMetadataImportEntity:
      description: Cluster profile import metadata
      properties:
        description:
