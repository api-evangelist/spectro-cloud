openapi: 3.2.0
info:
  title: Spectro Cloud Clusterprofiles API
  version: v1
  description: 'Operations tagged clusterprofiles across 2 of this provider''s published API definitions: spectro-cloud-palette-openapi.json, spectrocloud-palette.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.spectrocloud.com
- url: /
tags:
- name: clusterprofiles
  x-displayName: Clusterprofiles
paths:
  /v1/clusterprofiles:
    post:
      operationId: v1ClusterProfilesCreate
      parameters:
      - description: If true then cluster profile will be created and published in a single transaction
        in: query
        name: publish
        schema:
          type: boolean
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '201':
          description: Created successfully
          headers:
            AuditUid:
              description: Audit uid for the request
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Uid'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Creates a cluster profile
      tags:
      - clusterprofiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1ClusterProfileEntity'
    servers:
    - url: https://api.spectrocloud.com
  /v1/clusterprofiles/bulk:
    delete:
      operationId: v1ClusterProfilesBulkDelete
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1BulkDeleteResponse'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Deletes list of cluster profiles
      tags:
      - clusterprofiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1BulkDeleteRequest'
    servers:
    - url: https://api.spectrocloud.com
  /v1/clusterprofiles/import:
    post:
      operationId: v1ClusterProfilesImport
      parameters:
      - description: If true then cluster profile will be published post successful import
        in: query
        name: publish
        schema:
          type: boolean
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '201':
          description: Created successfully
          headers:
            AuditUid:
              description: Audit uid for the request
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Uid'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Imports a cluster profile
      tags:
      - clusterprofiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1ClusterProfileImportEntity'
    servers:
    - url: https://api.spectrocloud.com
  /v1/clusterprofiles/import/file:
    post:
      operationId: v1ClusterProfilesImportFile
      parameters:
      - description: If true then cluster profile will be published post successful import
        in: query
        name: publish
        schema:
          type: boolean
      - description: Cluster profile import file format ["yaml", "json"]
        in: query
        name: format
        schema:
          type: string
          enum:
          - yaml
          - json
          default: json
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '201':
          description: Created successfully
          headers:
            AuditUid:
              description: Audit uid for the request
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Uid'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Imports a cluster profile via file
      tags:
      - clusterprofiles
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                importFile:
                  type: string
                  description: Cluster profile import file
                  format: binary
    servers:
    - url: https://api.spectrocloud.com
  /v1/clusterprofiles/import/validate:
    post:
      operationId: v1ClusterProfilesImportValidate
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '200':
          description: Cluster profile import validated response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ClusterProfileImportEntity'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Validates cluster profile import
      tags:
      - clusterprofiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1ClusterProfileImportEntity'
    servers:
    - url: https://api.spectrocloud.com
  /v1/clusterprofiles/macros:
    get:
      operationId: v1MacrosList
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Macros'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Retrieves a list of macros
      tags:
      - clusterprofiles
    servers:
    - url: https://api.spectrocloud.com
  /v1/clusterprofiles/validate/name:
    get:
      description: Validates the cluster profile name and version
      operationId: v1ClusterProfilesValidateNameVersion
      parameters:
      - description: Cluster profile name
        in: query
        name: name
        schema:
          type: string
      - description: Cluster profile version
        in: query
        name: version
        schema:
          type: string
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '204':
          description: Ok response without content
          headers:
            AuditUid:
              description: Audit uid for the request
              schema:
                type: string
      security:
      - ApiKey: []
      - Authorization: []
      summary: Validates the cluster profile metadata
      tags:
      - clusterprofiles
    servers:
    - url: https://api.spectrocloud.com
  /v1/clusterprofiles/validate/packs:
    post:
      operationId: v1ClusterProfilesValidatePacks
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '200':
          description: Cluster profile packs validation response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ClusterProfileValidatorResponse'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Validates cluster profile packs
      tags:
      - clusterprofiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1ClusterProfileTemplateDraft'
    servers:
    - url: https://api.spectrocloud.com
  /v1/clusterprofiles/{uid}:
    parameters:
    - description: Cluster profile uid
      in: path
      name: uid
      required: true
      schema:
        type: string
    - description: Comma seperated pack meta such as schema, presets
      in: query
      name: includePackMeta
      schema:
        type: string
    - description: Filter cluster profiles by target resource type - 'spectrocluster' for profiles suitable to launch/update clusters, 'clustertemplate' for profiles suitable to create/edit cluster template
      in: query
      name: resourceType
      schema:
        type: string
        enum:
        - spectrocluster
        - clustertemplate
    - description: If true, includes pack annotations like OCI registry provider type and OCI pack archive URL
      in: query
      name: includePackAnnotations
      schema:
        type: boolean
    delete:
      operationId: v1ClusterProfilesDelete
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '204':
          description: The resource was deleted successfully
      security:
      - ApiKey: []
      - Authorization: []
      summary: Deletes the specified cluster profile
      tags:
      - clusterprofiles
    get:
      operationId: v1ClusterProfilesGet
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ClusterProfile'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Returns a specified cluster profile
      tags:
      - clusterprofiles
    put:
      operationId: v1ClusterProfilesUpdate
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '204':
          description: The resource was updated successfully
      security:
      - ApiKey: []
      - Authorization: []
      summary: Updates the specified cluster profile
      tags:
      - clusterprofiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1ClusterProfileUpdateEntity'
    servers:
    - url: https://api.spectrocloud.com
  /v1/clusterprofiles/{uid}/clone:
    parameters:
    - description: Cluster profile uid
      in: path
      name: uid
      required: true
      schema:
        type: string
    post:
      operationId: v1ClusterProfilesUidClone
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '201':
          description: Created successfully
          headers:
            AuditUid:
              description: Audit uid for the request
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Uid'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Creates a clone of the specified cluster profile
      tags:
      - clusterprofiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1ClusterProfileCloneEntity'
    servers:
    - url: https://api.spectrocloud.com
  /v1/clusterprofiles/{uid}/clone/validate:
    parameters:
    - description: Cluster profile uid
      in: path
      name: uid
      required: true
      schema:
        type: string
    post:
      description: Validates the cloned cluster profile name, version and target project uid
      operationId: v1ClusterProfilesUidCloneValidate
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '204':
          description: Ok response without content
          headers:
            AuditUid:
              description: Audit uid for the request
              schema:
                type: string
      security:
      - ApiKey: []
      - Authorization: []
      summary: Validates the cluster profile clone
      tags:
      - clusterprofiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1ClusterProfileCloneMetaInputEntity'
    servers:
    - url: https://api.spectrocloud.com
  /v1/clusterprofiles/{uid}/export:
    parameters:
    - description: Cluster profile uid
      in: path
      name: uid
      required: true
      schema:
        type: string
    - description: Cluster profile export file format [ "yaml", "json" ]
      in: query
      name: format
      schema:
        type: string
        enum:
        - yaml
        - json
        default: json
    get:
      operationId: V1ClusterProfilesUidExport
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '200':
          description: Exports cluster profile as a file
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
      security:
      - ApiKey: []
      - Authorization: []
      summary: Export the specified cluster profile
      tags:
      - clusterprofiles
    servers:
    - url: https://api.spectrocloud.com
  /v1/clusterprofiles/{uid}/export/terraform:
    parameters:
    - description: Cluster profile uid
      in: path
      name: uid
      required: true
      schema:
        type: string
    - description: Cluster profile export file format [ "yaml", "json" ]
      in: query
      name: format
      schema:
        type: string
        enum:
        - yaml
        - json
        default: yaml
    get:
      operationId: V1ClusterProfilesUidExportTerraform
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '200':
          description: Downloads cluster profile export file
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
      security:
      - ApiKey: []
      - Authorization: []
      summary: Downloads the specified cluster profile
      tags:
      - clusterprofiles
    servers:
    - url: https://api.spectrocloud.com
  /v1/clusterprofiles/{uid}/metadata:
    parameters:
    - description: Cluster profile uid
      in: path
      name: uid
      required: true
      schema:
        type: string
    patch:
      operationId: v1ClusterProfilesUidMetadataUpdate
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '204':
          description: The resource was updated successfully
      security:
      - ApiKey: []
      - Authorization: []
      summary: Updates the specified cluster profile metadata
      tags:
      - clusterprofiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1ProfileMetaEntity'
    servers:
    - url: https://api.spectrocloud.com
  /v1/clusterprofiles/{uid}/packRefs:
    parameters:
    - description: Cluster profile uid
      in: path
      name: uid
      required: true
      schema:
        type: string
    - description: Cluster profile notification uid
      in: query
      name: notify
      schema:
        type: string
    patch:
      operationId: v1ClusterProfilesPacksRefUpdate
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '204':
          description: The resource was updated successfully
      security:
      - ApiKey: []
      - Authorization: []
      summary: Updates cluster profile packs ref
      tags:
      - clusterprofiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1ClusterProfileNotificationUpdateEntity'
    servers:
    - url: https://api.spectrocloud.com
  /v1/clusterprofiles/{uid}/packs:
    parameters:
    - description: Cluster profile uid
      in: path
      name: uid
      required: true
      schema:
        type: string
    - description: Comma seperated pack meta such as schema, presets
      in: query
      name: includePackMeta
      schema:
        type: string
    get:
      operationId: v1ClusterProfilesUidPacksGet
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ClusterProfilePacksEntities'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Returns the specified cluster profile packs
      tags:
      - clusterprofiles
    post:
      operationId: v1ClusterProfilesUidPacksAdd
      parameters:
      - description: A project UID is required for project-scoped resources and should be omitted when targeting tenant-scoped resources
        in: header
        name: ProjectUid
        schema:
          type: string
      responses:
        '201':
          description: Created successfully
          headers:
            AuditUid:
              description: Audit uid for the request
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Uid'
      security:
      - ApiKey: []
      - Authorization: []
      summary: Adds a new pack to the specified cluster profile and returns the created pack…
      tags:
      - clusterprofiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1PackInputEntity'
    servers:
    - url: https://api.spectrocloud.com
  /v1/clusterprofiles/{uid}/packs/manifests:
