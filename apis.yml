aid: spectro-cloud
name: Spectro Cloud
description: Spectro Cloud provides Palette, an enterprise platform for managing the full lifecycle of Kubernetes clusters and cloud-native and
  AI infrastructure across data centers, public clouds, bare metal, and the edge. Palette uses declarative cluster profiles (packs, Helm charts,
  manifests) for repeatable deployments, unified VM, container, and AI-workload management, and granular governance across distributed and air-gapped
  environments. Palette VerteX adds FIPS 140 and FedRAMP posture for regulated and public-sector organizations. The Palette API is a large REST
  surface (1,200+ operations) covering clusters, cluster profiles, cloud accounts, projects, tenants, registries, and edge hosts, with Go/TypeScript
  SDKs, a Terraform provider, a Crossplane provider, and the Palette CLI for automation.
